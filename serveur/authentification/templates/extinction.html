<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte à rebours avant extinction</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Animation du cercle de progression */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        /* Effet de pulsation quand le temps est presque écoulé */
        @keyframes pulse-red {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }
        .pulse-danger {
            animation: pulse-red 0.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-rose-500 selection:text-white">

    <main class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-rose-900/40 rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center text-center">
        <!-- En-tête -->
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-rose-500/10 text-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-rose-500/20">
                <i class="fa-solid fa-power-off text-2xl animate-pulse"></i>
            </div>
            <h1 class="text-xl font-extrabold tracking-tight text-white">
                Avertissement système
            </h1>
            <p class="text-sm font-medium text-rose-400 mt-2">
                Compte à rebours avant que votre ordinateur s'éteigne
            </p>
        </div>

        <!-- Indicateur d'état -->
        <div id="statusBadge" class="px-3 py-1 text-xs font-semibold rounded-full bg-rose-950/80 text-rose-300 border border-rose-700/50 mb-6 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
            <span>Extinction imminente</span>
        </div>

        <!-- Chronomètre circulaire -->
        <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-2">
            <svg class="w-full h-full" viewBox="0 0 200 200">
                <!-- Cercle d'arrière-plan -->
                <circle 
                    class="text-slate-800" 
                    stroke-width="10" 
                    stroke="currentColor" 
                    fill="transparent" 
                    r="85" 
                    cx="100" 
                    cy="100" 
                />
                <!-- Cercle d'avancement -->
                <circle 
                    id="progressRing"
                    class="progress-ring__circle text-rose-500" 
                    stroke-width="10" 
                    stroke-linecap="round"
                    stroke="currentColor" 
                    fill="transparent" 
                    r="85" 
                    cx="100" 
                    cy="100" 
                    stroke-dasharray="534.07"
                    stroke-dashoffset="0"
                />
            </svg>

            <!-- Affichage du temps au centre -->
            <div class="absolute flex flex-col items-center justify-center">
                <span id="timeDisplay" class="text-6xl sm:text-7xl font-extrabold font-mono tracking-tight text-white drop-shadow-md pulse-danger">
                    30<span class="text-2xl sm:text-3xl text-rose-400 font-sans">s</span>
                </span>
                <span id="subDisplay" class="text-xs font-mono text-slate-400 mt-2">00:30.0</span>
            </div>
        </div>
    </main>

    <!-- JS Logic -->
    <script>
        const INITIAL_TIME = 30; // Temps initial en secondes
        let timeLeft = INITIAL_TIME;
        let timerInterval = null;

        // Éléments DOM
        const timeDisplay = document.getElementById('timeDisplay');
        const subDisplay = document.getElementById('subDisplay');
        const progressRing = document.getElementById('progressRing');
        const statusBadge = document.getElementById('statusBadge');

        // Calcul du périmètre de l'anneau SVG (2 * PI * r) où r = 85
        const RADIUS = 85;
        const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

        // Initialisation du cercle
        progressRing.style.strokeDasharray = `${CIRCUMFERENCE} ${CIRCUMFERENCE}`;
        progressRing.style.strokeDashoffset = 0;

        // Signal sonore
        function playBeep(frequency = 600, duration = 0.15, type = 'sawtooth') {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = type;
                osc.frequency.value = frequency;

                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                console.log("Audio non supporté.", e);
            }
        }

        function updateDisplay() {
            // Calcul des secondes entières
            const seconds = Math.ceil(timeLeft);
            
            // Format 00:00.0
            const mins = Math.floor(timeLeft / 60);
            const secs = Math.floor(timeLeft % 60);
            const tenths = Math.floor((timeLeft % 1) * 10);

            const formattedMinSec = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${tenths}`;

            // Mise à jour du texte
            timeDisplay.innerHTML = `${seconds}<span class="text-2xl sm:text-3xl text-rose-400 font-sans">s</span>`;
            subDisplay.textContent = formattedMinSec;

            // Mise à jour de l'anneau de progression
            const progress = timeLeft / INITIAL_TIME;
            const offset = CIRCUMFERENCE - (progress * CIRCUMFERENCE);
            progressRing.style.strokeDashoffset = offset;
        }

        function startTimer() {
            const startTime = Date.now();

            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                timeLeft = Math.max(0, INITIAL_TIME - elapsed);

                updateDisplay();

                if (timeLeft <= 0) {
                    finishTimer();
                }
            }, 50);
        }

        function finishTimer() {
            clearInterval(timerInterval);
            timeLeft = 0;
            updateDisplay();

            statusBadge.className = "px-3 py-1 text-xs font-semibold rounded-full bg-rose-600 text-white animate-bounce mb-6 flex items-center gap-2";
            statusBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i><span>Extinction en cours...</span>';

            playBeep(300, 0.4, 'sawtooth');
        }

        // Lancement automatique dès l'ouverture de la page
        window.addEventListener('DOMContentLoaded', () => {
            updateDisplay();
            startTimer();
        });
    </script>
</body>
</html>
